<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Weather Sounds</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="container">
            <h1>Weather sounds</h1>
            <div class="controls">
                <div class="controls-buttons">
                    <button data-sound="rain">
                        <img
                            src="src/assets/icons/cloud-rain.svg"
                            alt="Дождь"
                            class="icon"
                        />
                    </button>
                    <button data-sound="summer">
                        <img
                            src="src/assets/icons/sun.svg"
                            alt="Лето"
                            class="icon"
                        />
                    </button>
                    <button data-sound="winter">
                        <img
                            src="src/assets/icons/cloud-snow.svg"
                            alt="Зима"
                            class="icon"
                        />
                    </button>
                </div>
                <input
                    type="range"
                    id="volume"
                    min="0"
                    max="1"
                    step="0.01"
                    value="0.5"
                />
            </div>
        </div>
        <script type="module" src="dist/app.js"></script>
    </body>
</html>
